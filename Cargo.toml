[package]
name = "asterion"
version = "2.2.0"
edition = "2021"
description = "Autonomous agent loop for Claude Code"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
which = "7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress & colors
indicatif = "0.17"
owo-colors = "4"

# Signal handling
ctrlc = "3"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# HTTP client for update check
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
